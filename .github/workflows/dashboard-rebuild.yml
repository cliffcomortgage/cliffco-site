name: Daily Dashboard Rebuild

on:
  schedule:
    - cron: "0 13 * * *"  # 9 AM ET (13:00 UTC covers EST and EDT)
  workflow_dispatch:       # allow manual trigger from GitHub Actions UI

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        run: curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_REVERSE }}"
